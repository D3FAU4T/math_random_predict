# Windows-specific cmake configuration for building z3 from source.
#
# The cmake Rust crate auto-detects the newest MSVC toolchain and picks the
# matching Visual Studio generator. On this machine VS Community 2026 (v18) is
# installed alongside VS Build Tools 2022 (v17), causing cmake to select
# "Visual Studio 18 2026" which may not always be detected reliably.
#
# We pin to "Visual Studio 17 2022" to target the stable Build Tools 2022
# installation, which cmake reliably finds.
#
# On Linux/macOS, cmake ignores the VS generators and uses its platform default.

[env]
CMAKE_GENERATOR = "Visual Studio 17 2022"

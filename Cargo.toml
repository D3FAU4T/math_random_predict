[package]
name = "math_random_predict"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "solver"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
